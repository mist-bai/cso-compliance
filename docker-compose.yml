services:
  mysql:
    image: mysql:8.0
    container_name: cso_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cso_root_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cso_compliance}
      MYSQL_USER: ${MYSQL_USER:-cso}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cso_pass}
    ports:
      - "3307:3306"
    volumes:
      - cso_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-cso_root_pass}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: cso_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
    ports:
      - "${BACKEND_PORT:-8200}:8200"
    volumes:
      - ./backend:/app
      - cso_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8200 --reload

  frontend:
    image: node:20-slim
    container_name: cso_frontend
    working_dir: /app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "3200"
      NEXT_PUBLIC_API_BASE: /api
      BACKEND_INTERNAL_URL: http://backend:8200
    ports:
      - "${FRONTEND_PORT:-3200}:3200"
    volumes:
      - ./frontend:/app
      - cso_frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: bash -c "npm install --legacy-peer-deps && npm run dev"

volumes:
  cso_mysql_data:
  cso_uploads:
  cso_frontend_node_modules:
